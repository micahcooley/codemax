name: Linux validation
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: codemax-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libjson-c-dev curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - name: JavaScript dependencies
        run: npm install
      - name: Native project tools
        run: npm run test:real-tools
      - name: Frontend
        run: npm run check && npm run build
      - name: JavaScript and security boundaries
        run: npm test
      - name: Koryphaios adapter
        run: |
          node scripts/compile-koryphaios-adapter.mjs
          node --test tests/real/koryphaios.test.mjs
      - name: Zag source contracts
        run: npm run check:zag-contracts
      - name: Zag backend
        run: bash scripts/bootstrap-zag.sh && npm run test:native
      - name: Tauri host
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Linux packages
        run: npm run tauri -- build --bundles deb,appimage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codemax-linux
          path: src-tauri/target/release/bundle/
          if-no-files-found: warn

name: Linux source-alpha validation
on:
  workflow_dispatch:
  push:
    branches: ["desktop-ai-bridge/**"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: bridge-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Desktop prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - name: Resolve alpha dependencies (lockfile not yet qualified)
        run: npm install
      - name: Frontend typecheck and build
        run: npm run check && npm run build
      - name: Node unit, fixture transport, and static boundary checks
        run: npm test
      - name: Browser fixture dependencies
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
          echo "CHROMIUM=$(python3 -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" >> "$GITHUB_ENV"
      - name: Actual instrumentation with in-memory browser fixture
        run: npm run test:browser:dom
      - name: Browser network fixture (requires runner policy to permit loopback)
        run: npm run test:browser
      - name: Pinned Zag native build and gateway fixture
        run: bash scripts/bootstrap-zag.sh && npm run test:native
      - name: Host unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build alpha packages
        run: npm run tauri -- build --bundles deb,appimage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-alpha-evidence
          path: |
            tests/evidence/
            build/*.sha256
            src-tauri/target/release/bundle/
          if-no-files-found: warn
# Source only: this workflow has NOT been dispatched or verified in this delivery.
# Before release, pin third-party actions and all package dependencies to reviewed digests/lockfiles.

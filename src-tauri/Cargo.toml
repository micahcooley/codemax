[package]
name = "desktop-ai-bridge"
version = "0.1.0-dev.2"
edition = "2021"
description = "Thin Tauri host for a native Zag AI bridge"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["unstable", "devtools"] }
tauri-plugin-shell = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt", "macros", "net"] }
url = "2"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "tokio"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true

[package]
name = "codemax"
version = "0.1.0-dev.7"
edition = "2021"
description = "Thin Tauri host for Codemax"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["unstable", "devtools"] }
tauri-plugin-shell = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt", "macros", "net"] }
url = "2"
rfd = { version = "0.17" }
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
security-framework = "3"
aes-gcm = "0.10"
aes = "0.8"
cbc = "0.1"
cipher = "0.4"
pbkdf2 = "0.12"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
time = "0.3"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true
